[project]
name = "wechat-extract-mac"
version = "0.1.0"
description = "WeChat Mac Chat History Exporter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.3.0",
    "requests>=2.31.0",
    "zstandard>=0.21.0",
    "scrapy>=2.11.0",
    "beautifulsoup4>=4.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
